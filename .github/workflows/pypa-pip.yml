name: ds3-unseen-pypa-pip
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
    - name: adapted no-op (original steps not executed in witness copy)
      run: 'echo ''adapted original job: no project commands executed'''
  determine-changes:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
      vendoring: ${{ steps.filter.outputs.vendoring }}
    steps:
    - name: adapted no-op (original steps not executed in witness copy)
      run: 'echo ''adapted original job: no project commands executed'''
  packaging:
    name: packaging / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - name: adapted no-op (original steps not executed in witness copy)
      run: 'echo ''adapted original job: no project commands executed'''
  vendoring:
    name: vendoring
    runs-on: ubuntu-latest
    needs:
    - determine-changes
    if: needs.determine-changes.outputs.vendoring == 'true' || github.event_name != 'pull_request'
    steps:
    - name: adapted no-op (original steps not executed in witness copy)
      run: 'echo ''adapted original job: no project commands executed'''
  tests-unix:
    name: tests / ${{ matrix.python.version || matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs:
    - determine-changes
    if: needs.determine-changes.outputs.tests == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: true
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        python:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        - '3.15'
        - 3.14t
        include:
        - os: ubuntu-24.04
          python:
            key: '3.10'
            version: 3.10.4
        - os: ubuntu-24.04
          python:
            key: '3.11'
            version: 3.11.0
        - os: ubuntu-24.04
          python:
            key: '3.12'
            version: 3.12.0
        - os: ubuntu-24.04
          python:
            key: '3.13'
            version: 3.13.0
        - os: ubuntu-24.04
          python:
            key: '3.14'
            version: 3.14.0
    steps:
    - name: adapted no-op (original steps not executed in witness copy)
      run: 'echo ''adapted original job: no project commands executed'''
  tests-windows:
    name: tests / ${{ matrix.python }} / ${{ matrix.os }} / ${{ matrix.group }}
    runs-on: ${{ matrix.os }}-latest
    needs:
    - determine-changes
    if: needs.determine-changes.outputs.tests == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: true
      matrix:
        os:
        - Windows
        python:
        - '3.10'
        - '3.14'
        - '3.15'
        - 3.14t
        group:
        - 1
        - 2
        - 3
    steps:
    - name: adapted no-op (original steps not executed in witness copy)
      run: 'echo ''adapted original job: no project commands executed'''
  tests-zipapp:
    name: tests / zipapp
    runs-on: ubuntu-latest
    needs:
    - determine-changes
    if: needs.determine-changes.outputs.tests == 'true' || github.event_name != 'pull_request'
    steps:
    - name: adapted no-op (original steps not executed in witness copy)
      run: 'echo ''adapted original job: no project commands executed'''
  check:
    if: always()
    needs:
    - determine-changes
    - docs
    - packaging
    - tests-unix
    - tests-windows
    - tests-zipapp
    - vendoring
    runs-on: ubuntu-latest
    steps:
    - name: adapted no-op (original steps not executed in witness copy)
      run: 'echo ''adapted original job: no project commands executed'''
  identity-witness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: OIDC identity attestation
      env:
        WITNESS_WORKFLOW_PATH: .github/workflows/pypa-pip.yml
        WITNESS_FAMILY: pypa-pip
        SOURCE_REPOSITORY: pypa/pip
        SOURCE_COMMIT: 4b71f36fb4dfbc87ce65ac4710eeccf81d379f55
        SOURCE_WORKFLOW_PATH: .github/workflows/ci.yml
        SOURCE_WORKFLOW_SHA256: 4c21a6fb1f89ba606355f8a602b27314459e62da2da0decbe55547d61b9c3b9c
      run: "\npython3 - <<'PY'\nimport base64, hashlib, json, os, urllib.request\nfrom datetime import datetime, timezone\n\npath = os.environ[\"WITNESS_WORKFLOW_PATH\"]\nblob = open(path, \"rb\").read()\nsha = hashlib.sha256(blob).hexdigest()\nurl = os.environ[\"ACTIONS_ID_TOKEN_REQUEST_URL\"]\nreq = urllib.request.Request(url + \"&audience=ds-hns-identity\",\n                             headers={\"Authorization\": \"bearer \" + os.environ[\"ACTIONS_ID_TOKEN_REQUEST_TOKEN\"]})\nwith urllib.request.urlopen(req) as response:\n    token = json.loads(response.read().decode())[\"value\"]\natt = {\n    \"schema\": \"ds-hns-identity-attestation/1\",\n    \"repository\": os.environ[\"GITHUB_REPOSITORY\"],\n    \"run_id\": int(os.environ[\"GITHUB_RUN_ID\"]),\n    \"run_attempt\": int(os.environ[\"GITHUB_RUN_ATTEMPT\"]),\n    \"head_sha\": os.environ[\"GITHUB_SHA\"],\n    \"ref\": os.environ[\"GITHUB_REF\"],\n    \"workflow_ref\": os.environ[\"GITHUB_WORKFLOW_REF\"],\n    \"workflow_path\": path,\n\
        \    \"workflow_sha256\": sha,\n    \"source_repository\": os.environ[\"SOURCE_REPOSITORY\"],\n    \"source_commit\": os.environ[\"SOURCE_COMMIT\"],\n    \"source_workflow_path\": os.environ[\"SOURCE_WORKFLOW_PATH\"],\n    \"source_workflow_sha256\": os.environ[\"SOURCE_WORKFLOW_SHA256\"],\n    \"family\": os.environ[\"WITNESS_FAMILY\"],\n    \"job\": os.environ[\"GITHUB_JOB\"],\n    \"event_name\": os.environ[\"GITHUB_EVENT_NAME\"],\n    \"oidc_token\": token,\n    \"captured_at_utc\": datetime.now(timezone.utc).strftime(\"%Y-%m-%dT%H:%M:%SZ\"),\n}\nopen(\"attestation.json\", \"w\", encoding=\"utf-8\").write(json.dumps(att, indent=2, sort_keys=True) + \"\\n\")\nPY\n"
    - uses: actions/upload-artifact@v4
      with:
        name: identity-attestation
        path: attestation.json
        if-no-files-found: error
