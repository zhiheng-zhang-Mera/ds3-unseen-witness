name: ds3-unseen-tiangolo-fastapi
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    timeout-minutes: 5
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
    - name: adapted no-op (original steps not executed in witness copy)
      run: 'echo ''adapted original job: no project commands executed'''
  test:
    needs:
    - changes
    if: needs.changes.outputs.src == 'true' || github.ref == 'refs/heads/master'
    timeout-minutes: 10
    strategy:
      matrix:
        os:
        - windows-latest
        - macos-latest
        python-version:
        - '3.14'
        - 3.14t
        deprecated-tests:
        - no-deprecation
        uv-resolution:
        - highest
        starlette-src:
        - starlette-pypi
        - starlette-git
        include:
        - os: macos-latest
          python-version: '3.10'
          coverage: coverage
          uv-resolution: lowest-direct
          deprecated-tests: no-deprecation
        - os: windows-latest
          python-version: '3.12'
          coverage: coverage
          uv-resolution: lowest-direct
          deprecated-tests: no-deprecation
        - os: ubuntu-latest
          python-version: '3.13'
          coverage: coverage
          uv-resolution: highest
          deprecated-tests: no-deprecation
        - os: ubuntu-latest
          python-version: '3.13'
          uv-resolution: highest
          codspeed: codspeed
          deprecated-tests: no-deprecation
        - os: ubuntu-latest
          python-version: '3.13'
          uv-resolution: highest
          deprecated-tests: no-deprecation
          without-httpx2: true
        - os: ubuntu-latest
          python-version: '3.14'
          coverage: coverage
          uv-resolution: highest
          starlette-src: starlette-git
          deprecated-tests: test-deprecation
        - os: ubuntu-latest
          python-version: 3.14t
          coverage: coverage
          uv-resolution: highest
          deprecated-tests: no-deprecation
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_RESOLUTION: ${{ matrix.uv-resolution }}
      STARLETTE_SRC: ${{ matrix.starlette-src }}
    steps:
    - name: adapted no-op (original steps not executed in witness copy)
      run: 'echo ''adapted original job: no project commands executed'''
  benchmark:
    needs:
    - changes
    if: needs.changes.outputs.src == 'true' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: '3.13'
      UV_RESOLUTION: highest
    steps:
    - name: adapted no-op (original steps not executed in witness copy)
      run: 'echo ''adapted original job: no project commands executed'''
  regression-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: adapted no-op (original steps not executed in witness copy)
      run: 'echo ''adapted original job: no project commands executed'''
  coverage-combine:
    needs:
    - test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: adapted no-op (original steps not executed in witness copy)
      run: 'echo ''adapted original job: no project commands executed'''
  test-alls-green:
    if: always()
    needs:
    - test
    - coverage-combine
    - benchmark
    - regression-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: adapted no-op (original steps not executed in witness copy)
      run: 'echo ''adapted original job: no project commands executed'''
  identity-witness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: OIDC identity attestation
      env:
        WITNESS_WORKFLOW_PATH: .github/workflows/tiangolo-fastapi.yml
        WITNESS_FAMILY: tiangolo-fastapi
        SOURCE_REPOSITORY: tiangolo/fastapi
        SOURCE_COMMIT: ba47d6d71b3e806900c8471f2f661781b8c43ec4
        SOURCE_WORKFLOW_PATH: .github/workflows/test.yml
        SOURCE_WORKFLOW_SHA256: 135bba26ec3144f6a5f18bf4791e1514f13b91dd37b3b564d64dd1672be93393
      run: "\nimport base64, hashlib, json, os, urllib.request\nfrom datetime import datetime, timezone\n\npath = os.environ[\"WITNESS_WORKFLOW_PATH\"]\nblob = open(path, \"rb\").read()\nsha = hashlib.sha256(blob).hexdigest()\nurl = os.environ[\"ACTIONS_ID_TOKEN_REQUEST_URL\"]\nreq = urllib.request.Request(url + \"&audience=ds-hns-identity\",\n                             headers={\"Authorization\": \"bearer \" + os.environ[\"ACTIONS_ID_TOKEN_REQUEST_TOKEN\"]})\nwith urllib.request.urlopen(req) as response:\n    token = json.loads(response.read().decode())[\"value\"]\natt = {\n    \"schema\": \"ds-hns-identity-attestation/1\",\n    \"repository\": os.environ[\"GITHUB_REPOSITORY\"],\n    \"run_id\": int(os.environ[\"GITHUB_RUN_ID\"]),\n    \"run_attempt\": int(os.environ[\"GITHUB_RUN_ATTEMPT\"]),\n    \"head_sha\": os.environ[\"GITHUB_SHA\"],\n    \"ref\": os.environ[\"GITHUB_REF\"],\n    \"workflow_ref\": os.environ[\"GITHUB_WORKFLOW_REF\"],\n    \"workflow_path\": path,\n    \"workflow_sha256\"\
        : sha,\n    \"source_repository\": os.environ[\"SOURCE_REPOSITORY\"],\n    \"source_commit\": os.environ[\"SOURCE_COMMIT\"],\n    \"source_workflow_path\": os.environ[\"SOURCE_WORKFLOW_PATH\"],\n    \"source_workflow_sha256\": os.environ[\"SOURCE_WORKFLOW_SHA256\"],\n    \"family\": os.environ[\"WITNESS_FAMILY\"],\n    \"job\": os.environ[\"GITHUB_JOB\"],\n    \"event_name\": os.environ[\"GITHUB_EVENT_NAME\"],\n    \"oidc_token\": token,\n    \"captured_at_utc\": datetime.now(timezone.utc).strftime(\"%Y-%m-%dT%H:%M:%SZ\"),\n}\nopen(\"attestation.json\", \"w\", encoding=\"utf-8\").write(json.dumps(att, indent=2, sort_keys=True) + \"\\n\")\n"
    - uses: actions/upload-artifact@v4
      with:
        name: identity-attestation
        path: attestation.json
        if-no-files-found: error
